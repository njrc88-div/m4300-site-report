services:
  m4300-site-report:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Optional - see .env.example. Missing .env or unset vars just means
    # Google sign-in stays disabled; nothing else in this file depends on it.
    env_file:
      - path: .env
        required: false
    # Bind-mounted (not a named volume) so the audit log - sign-in/out
    # events when Google sign-in is enabled - survives `docker compose up
    # --build` recreating the container, and so you can inspect the raw
    # file directly if you ever need to.
    volumes:
      - ./data:/srv/data
